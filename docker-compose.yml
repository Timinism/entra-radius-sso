services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: ${HARBOR_DB_PASSWORD:-harbor}
      POSTGRES_DB: harbor
    volumes:
      - harbor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 5s
      retries: 12

  harbor:
    build: .
    ports:
      - "3847:3847"
      - "11812:11812/udp"
      - "11813:11813/udp"
    environment:
      PORT: "3847"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://harbor:${HARBOR_DB_PASSWORD:-harbor}@db:5432/harbor
      HARBOR_RADIUS_PORT: "11812"
      HARBOR_ACCT_PORT: "11813"
      HARBOR_COMPONENT_UPDATES: "0"
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3847/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  harbor-db:
